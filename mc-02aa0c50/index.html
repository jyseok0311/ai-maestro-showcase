<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1916">
<title>사회자 큐카드 · AI 마에스트로 성과공유회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --bg:#F6F2EA; --card:#FFFFFF; --ink:#1A1916; --ink2:#4A463E; --muted:#8A8274; --gold:#A87B22; --gold2:#E2B85C; --line:#E6DFD0;
        --tip:#FBF4E4; --ok:#2E8B57; --hot:#C0392B; --fs:19px; }
:root[data-dark="1"] { --bg:#0F0E0C; --card:#1C1B18; --ink:#F3EEE3; --ink2:#CFC8B8; --muted:#8C8576; --line:#33302A; --tip:#2A2418; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:'Pretendard','Malgun Gothic',sans-serif; word-break:keep-all; }
body { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.top { position:sticky; top:0; z-index:20; background:var(--ink); color:#F3EEE3; padding:10px 14px 0; padding-top:calc(10px + env(safe-area-inset-top)); }
:root[data-dark="1"] .top { background:#000; }
.top .r1 { display:flex; align-items:center; gap:10px; }
.top h1 { font-size:14px; font-weight:700; color:var(--gold2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.clock { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
.tools { display:flex; gap:6px; }
.tools button { width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.1); font-weight:800; font-size:14px; }
.tools button.on { background:var(--gold2); color:var(--ink); }
.now { margin-top:8px; display:flex; align-items:center; gap:8px; font-size:13.5px; }
.now b { color:var(--gold2); } .now .left { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700; }
.bar { height:3px; background:rgba(255,255,255,.15); margin:8px -14px 0; } .bar i { display:block; height:100%; width:0; background:var(--gold2); transition:width .5s; }
.tabs { display:flex; margin:0 -14px; }
.tabs button { flex:1; padding:10px 0 9px; font-size:14px; font-weight:700; color:#B9B2A3; border-bottom:3px solid transparent; }
.tabs button.on { color:#fff; border-color:var(--gold2); }
.view { display:none; } .view.on { display:block; }
/* 큐카드 */
.deck { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.deck::-webkit-scrollbar { display:none; }
.card { flex:0 0 100%; scroll-snap-align:start; padding:14px 14px 20px; min-height:calc(100vh - 210px); }
.ch { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.no { background:var(--ink); color:var(--bg); font-weight:800; font-size:13px; padding:4px 9px; border-radius:8px; }
:root[data-dark="1"] .no { background:var(--gold2); color:#000; }
.tm { font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; color:var(--gold); }
.st { margin-left:auto; font-size:12.5px; font-weight:800; padding:4px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
.st.live { background:var(--hot); border-color:var(--hot); color:#fff; } .st.done { background:var(--ok); border-color:var(--ok); color:#fff; }
.card h2 { margin-top:8px; font-size:calc(var(--fs) + 6px); font-weight:800; line-height:1.3; }
.who { margin-top:4px; font-size:14px; color:var(--ink2); font-weight:600; }
.kw { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
.kw span { background:var(--tip); border:1px solid var(--line); border-radius:8px; padding:5px 9px; font-size:13.5px; font-weight:700; }
.ment { margin-top:14px; display:flex; flex-direction:column; gap:12px; }
.ment p { font-size:var(--fs); line-height:1.65; font-weight:500; }
.ment p.cue { font-size:calc(var(--fs) - 3px); line-height:1.5; font-weight:700; color:var(--gold); background:var(--tip); border-left:4px solid var(--gold2); padding:8px 10px; border-radius:0 8px 8px 0; }
.blank { color:var(--hot); font-weight:800; background:rgba(192,57,43,.1); border-radius:4px; padding:0 2px; }
.endm { margin-top:14px; font-size:13px; color:var(--muted); } .endm b { color:var(--ink); }
details.stage { margin-top:16px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
details.stage summary { padding:11px 12px; font-weight:800; font-size:14px; list-style:none; } details.stage summary::-webkit-details-marker { display:none; }
details.stage summary::after { content:'펼치기 ▾'; float:right; color:var(--muted); font-weight:600; font-size:12.5px; }
details.stage[open] summary::after { content:'접기 ▴'; }
.kv { padding:0 12px 10px; display:grid; grid-template-columns:52px 1fr; gap:6px 8px; font-size:14px; line-height:1.5; }
.kv dt { color:var(--muted); font-weight:700; } .kv dd { color:var(--ink2); }
.donebtn { margin-top:18px; width:100%; padding:15px; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:800; font-size:17px; }
:root[data-dark="1"] .donebtn { background:var(--gold2); color:#000; }
.donebtn.is { background:var(--ok); color:#fff; }
/* 아래 넘김 바 */
.nav { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
       background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-top:1px solid var(--line); }
.nav button { height:50px; border-radius:14px; font-weight:800; font-size:16px; }
.nav .pv, .nav .nx { flex:1; background:var(--card); border:1px solid var(--line); }
.nav .go { padding:0 14px; background:var(--hot); color:#fff; font-size:14px; }
.nav .pos { min-width:54px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; }
/* 목록형 */
.list { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.row { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; text-align:left; width:100%; }
.row .t { font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold); min-width:46px; font-size:14.5px; }
.row .b { flex:1; } .row .b b { display:block; font-size:15.5px; } .row .b span { font-size:13px; color:var(--muted); }
.row.live { border-color:var(--hot); box-shadow:0 0 0 2px rgba(192,57,43,.25); } .row.done { opacity:.55; }
.row .m { font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap; } .row.live .m { color:var(--hot); } .row.done .m { color:var(--ok); }
.chk { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
.chk input { width:24px; height:24px; accent-color:var(--ok); flex:none; margin-top:2px; }
.chk b { font-size:15.5px; } .chk p { font-size:14px; color:var(--ink2); line-height:1.5; margin-top:2px; } .chk em { font-style:normal; font-size:12px; color:var(--gold); font-weight:800; }
.chk.ok { opacity:.55; }
.sec { padding:14px; } .sec h3 { font-size:17px; font-weight:800; margin:6px 0 10px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
.box p, .box li { font-size:15px; line-height:1.6; } .box ul { padding-left:18px; } .box .k { font-weight:800; color:var(--gold); font-size:13px; }
.reset { margin:6px 14px 20px; padding:12px; width:calc(100% - 28px); border-radius:12px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
.toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:14px; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none; z-index:30; }
.toast.on { opacity:1; }
</style>
</head>
<body>
<header class="top">
  <div class="r1">
    <h1>사회자 큐카드 · AI 마에스트로</h1>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="r1" style="margin-top:6px">
    <div class="tools">
      <button id="fsDown" aria-label="글자 작게">가-</button><button id="fsUp" aria-label="글자 크게">가+</button>
      <button id="dark" aria-label="어두운 화면">◐</button><button id="wake" aria-label="화면 꺼짐 방지">☀</button>
    </div>
    <div class="now" style="margin:0 0 0 auto"><span id="nowLabel">행사 전</span></div>
  </div>
  <div class="now"><span>다음 큐까지</span><span class="left" id="left">--:--</span></div>
  <div class="bar"><i id="bar"></i></div>
  <nav class="tabs" id="tabs">
    <button data-v="deck" class="on">큐카드</button><button data-v="flow">진행표</button><button data-v="pre">사전 점검</button><button data-v="ref">참고</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-deck"><div class="deck" id="deck"></div></section>
  <section class="view" id="v-flow"><div class="list" id="flow"></div></section>
  <section class="view" id="v-pre"><div class="list" id="pre"></div><button class="reset" id="reset">모든 체크 지우기</button></section>
  <section class="view" id="v-ref"><div class="sec" id="ref"></div></section>
</main>

<div class="nav" id="nav">
  <button class="pv" id="pv">‹ 이전</button><span class="pos" id="pos">1/1</span><button class="nx" id="nx">다음 ›</button><button class="go" id="go">지금</button>
</div>
<div class="toast" id="toast"></div>

// ── 시각: ?t=14:20 이면 그 시각으로 흉내(리허설용), 아니면 한국 시각 ──
const T0 = new URLSearchParams(location.search).get('t');
const startReal = Date.now();
function nowMin() {
  if (T0) return min(T0) + (Date.now() - startReal) / 60000;
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return g('hour') * 60 + g('minute') + g('second') / 60;
}

  return `<article class="card" data-no="${esc(c.번호)}">

}

$('pre').innerHTML = D.check.map(([k, v, when], i) => `<label class="chk" data-c="${i}"><input type="checkbox" data-ck="${i}"><span><b>${esc(k)}</b> <em>${esc(when)}</em><p>${hl(v)}</p></span></label>`).join('');
$('pre').addEventListener('change', e => { const i = e.target.dataset.ck; if (i === undefined) return; checks[i] = e.target.checked; store.set('checks', checks); paint(); });
$('reset').onclick = () => { if (!confirm('완료 표시와 사전 점검 체크를 모두 지울까요?')) return; done = {}; checks = {}; store.set('done', done); store.set('checks', checks); paint(); toast('모두 지웠습니다'); };

// ── 참고 ──
const S = D.speaker;
$('ref').innerHTML = `
  <h3>비상 멘트</h3><div class="box">${D.spare.멘트.map(p => `<p style="margin-bottom:8px">${hl(p)}</p>`).join('')}</div>
  <h3>사회자 참고 수치</h3>${D.facts.map(([k, v]) => `<div class="box"><div class="k">${esc(k)}</div><p>${hl(v)}</p></div>`).join('')}
  <h3>AX 특강 강사 · ${esc(S.호칭)}</h3>
  <div class="box"><div class="k">${esc(S.소속)}</div><ul>${S.약력.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="box"><ul>${S.경력.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p style="margin-top:6px">저서 ${esc(S.저서)}</p></div>
  <div class="box"><div class="k">특강 구성</div><ul>${S.특강.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  <h3>행사</h3><div class="box">${Object.entries(D.event).map(([k, v]) => `<p><b>${esc(k)}</b> ${esc(v)}</p>`).join('')}</div>`;

// ── 탭 ──
function show(v) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $('nav').style.display = v === 'deck' ? 'flex' : 'none';
  if (v === 'deck') goCard(cur, false);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });

// ── 시각에 따라 상태 칠하기 ──
const liveCue = t => CUES.filter(c => t >= min(c.시작) && t < min(c.끝)).pop();
const liveCardIndex = () => { const t = nowMin(); const c = CARDS.filter(c => t >= min(c.시작) && t < min(c.끝)).pop(); return c ? CARDS.indexOf(c) : -1; };
function paint() {
  const t = nowMin(), live = liveCue(t);
  document.querySelectorAll('[data-st]').forEach(el => { const no = el.dataset.st, c = CUES.find(x => x.번호 === no);
    const isLive = live && live.번호 === no;
    el.className = 'st' + (done[no] ? ' done' : isLive ? ' live' : ''); el.textContent = done[no] ? '완료' : isLive ? '지금 진행' : t < min(c.시작) ? '예정' : '지남'; });
  document.querySelectorAll('[data-done]').forEach(b => { const d = !!done[b.dataset.done]; b.classList.toggle('is', d); b.textContent = d ? '✓ 완료 (누르면 취소)' : '이 큐 완료 → 다음 카드'; });
  document.querySelectorAll('[data-row]').forEach(r => { const no = r.dataset.row, c = CUES.find(x => x.번호 === no), isLive = live && live.번호 === no;
    r.classList.toggle('live', !!isLive); r.classList.toggle('done', !!done[no]);
    r.querySelector('.m').textContent = done[no] ? '완료' : isLive ? '진행 중' : t >= min(c.끝) ? '지남' : ''; });
  document.querySelectorAll('[data-ck]').forEach(i => { i.checked = !!checks[i.dataset.ck]; i.closest('.chk').classList.toggle('ok', i.checked); });
}
function tick() {
  const t = nowMin(), h = Math.floor(t / 60), m = Math.floor(t % 60);
  $('clock').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  const live = liveCue(t), next = CUES.find(c => min(c.시작) > t);
  $('nowLabel').innerHTML = live ? `지금 <b>${esc(live.순서)}</b>` : next ? '행사 전 · 대기' : '행사 종료';
  if (next) { const s = Math.max(0, Math.round((min(next.시작) - t) * 60)); $('left').textContent = `${esc(next.순서)} · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  else $('left').textContent = '-';
  $('bar').style.width = live ? Math.min(100, (t - min(live.시작)) / (min(live.끝) - min(live.시작)) * 100) + '%' : '0';
  paint();
}
setInterval(tick, 1000); tick();

// ── 글자 크기 · 어두운 화면 · 화면 켜짐 유지 ──
$('fsUp').onclick = () => { fs = Math.min(30, fs + 2); store.set('fs', fs); applyFs(); };
$('fsDown').onclick = () => { fs = Math.max(15, fs - 2); store.set('fs', fs); applyFs(); };
$('dark').onclick = () => { const on = document.documentElement.dataset.dark !== '1'; document.documentElement.dataset.dark = on ? '1' : ''; store.set('dark', on ? 1 : 0); $('dark').classList.toggle('on', on); };
let lock = null;
$('wake').onclick = async () => {
  try {
    if (lock) { await lock.release(); lock = null; $('wake').classList.remove('on'); toast('화면 꺼짐 방지 끔'); return; }
    lock = await navigator.wakeLock.request('screen'); $('wake').classList.add('on'); toast('화면이 꺼지지 않게 유지합니다');
    lock.addEventListener('release', () => { lock = null; $('wake').classList.remove('on'); });
  } catch (e) { toast('이 브라우저는 화면 꺼짐 방지를 지원하지 않습니다'); }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('wake').classList.contains('on') && !lock) $('wake').click(); });

// 처음 열 때: 진행 중인 큐가 있으면 그 카드, 없으면 마지막으로 보던 카드
const li = liveCardIndex(); requestAnimationFrame(() => goCard(li >= 0 ? li : store.get('cur', 0), false));
addEventListener('resize', () => goCard(cur, false));
</script>
</body>
</html>
