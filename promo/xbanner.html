<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>엑스배너_H</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"><style>
:root { --bg:#F3EEE3; --ink:#1A1916; --ink2:#5b564c; --gold:#A87B22; --gold2:rgba(168,123,34,.5); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif; color:var(--ink); background:var(--bg); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.sans { font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif; }
.canvas { position:relative; overflow:hidden; background:var(--bg); }
.canvas::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%); }
.frame { position:absolute; border:var(--fb) solid var(--gold); }
.frame::after { content:''; position:absolute; inset:var(--fi); border:calc(var(--fb) * .55) solid var(--gold2); }
.staff { position:relative; }
.staff .l { position:absolute; left:0; right:0; background:var(--ink); }
.note { position:absolute; border-radius:50%; background:var(--ink); transform:rotate(-22deg); }
.note::after { content:''; position:absolute; right:0; background:var(--ink); }
.note.last { background:var(--gold); } .note.last::after { background:var(--gold); }
em { font-style:normal; color:var(--gold); }

@page { size:600mm 1800mm; margin:0; }
html, body { width:600mm; height:1800mm; }
.canvas { width:600mm; height:1800mm; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; padding:62mm 50mm 80mm; --fb:1.2mm; --fi:4mm; }
.g { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; }
.frame { inset:20mm; }
.org { position:relative; font-size:15mm; font-weight:700; letter-spacing:.06em; color:var(--ink2); }
.pre { position:relative; margin-top:0; font-size:17mm; color:var(--gold); letter-spacing:.32em; font-weight:700; }
h2 { position:relative; margin-top:10mm; font-size:76mm; font-weight:800; letter-spacing:-.03em; line-height:1.1; }
.sub { position:relative; margin-top:8mm; font-size:30mm; font-weight:700; }
.st { position:relative; }
.head { position:relative; margin-top:0; font-size:39mm; font-weight:800; line-height:1.4; letter-spacing:-.03em; }
.lead { position:relative; margin-top:16mm; font-size:17mm; font-weight:700; color:var(--ink2); }
.prog { position:relative; width:100%; border-top:1mm solid var(--ink); text-align:left; }
.prog div { display:grid; grid-template-columns:48mm 1fr; padding:16mm 0 15mm; border-bottom:.5mm solid rgba(0,0,0,.25); align-items:baseline; }
.prog .m { color:var(--gold); font-weight:800; font-size:28mm; }
.prog b { display:block; font-size:29mm; font-weight:800; }
.prog small { display:block; margin-top:5mm; font-size:16mm; color:var(--ink2); }
.foot { position:relative; }
.when { font-size:52mm; font-weight:900; letter-spacing:-.04em; }
.time { margin-top:4mm; font-size:34mm; font-weight:800; color:var(--gold); }
.where { margin-top:10mm; font-size:22mm; font-weight:700; }
</style></head><body><div class="canvas"><div class="frame"></div>
