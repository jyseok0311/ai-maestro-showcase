<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>현수막_H</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"><style>
:root { --bg:#F3EEE3; --ink:#1A1916; --ink2:#5b564c; --gold:#A87B22; --gold2:rgba(168,123,34,.5); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif; color:var(--ink); background:var(--bg); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.sans { font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif; }
.canvas { position:relative; overflow:hidden; background:var(--bg); }
.canvas::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%); }
.frame { position:absolute; border:var(--fb) solid var(--gold); }
.frame::after { content:''; position:absolute; inset:var(--fi); border:calc(var(--fb) * .55) solid var(--gold2); }
.staff { position:relative; }
.staff .l { position:absolute; left:0; right:0; background:var(--ink); }
.note { position:absolute; border-radius:50%; background:var(--ink); transform:rotate(-22deg); }
.note::after { content:''; position:absolute; right:0; background:var(--ink); }
.note.last { background:var(--gold); } .note.last::after { background:var(--gold); }
em { font-style:normal; color:var(--gold); }

@page { size:5000mm 900mm; margin:0; }
html, body { width:5000mm; height:900mm; }

.sub { margin-top:14mm; font-size:84mm; font-weight:700; }
.mid { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; }
.head { margin-top:30mm; font-size:104mm; font-weight:800; letter-spacing:-.035em; white-space:nowrap; }
.lead { margin-top:16mm; font-size:44mm; font-weight:700; color:var(--ink2); }
.right { position:relative; flex:none; width:900mm; border-left:3mm solid var(--gold2); padding-left:110mm; }
.when { font-size:142mm; font-weight:900; letter-spacing:-.04em; line-height:1.05; }
.time { margin-top:8mm; font-size:96mm; font-weight:800; color:var(--gold); }
.where { margin-top:30mm; font-size:56mm; font-weight:700; }
.org { margin-top:34mm; font-size:40mm; font-weight:700; color:var(--ink2); }
