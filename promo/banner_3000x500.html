<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>현수막_확정</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"><style>
:root { --bg:#F2EEE3; --ink:#1A1916; --ink2:#5B564C; --gold:#A87B22; --gold6:rgba(168,123,34,.6); --quote:#908978; --due:#80796A; --dot:rgba(205,150,41,.55); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif; color:var(--ink); background:#F2EEE3;
       -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.canvas { position:relative; overflow:hidden; background:radial-gradient(ellipse 75% 60% at 50% 38%, #FAF7F2 0%, #F5F1E8 55%, #F2EEE2 100%); }
.frame { position:absolute; border:var(--fb) solid var(--gold); }
.frame::after { content:''; position:absolute; inset:var(--fi); border:calc(var(--fb) * .57) solid rgba(168,123,34,.5); }
.org { font-weight:700; color:var(--ink2); letter-spacing:.09em; }
.perf { display:flex; align-items:center; justify-content:center; gap:.9em; color:var(--gold); font-weight:700; letter-spacing:.3em; }
.perf::before, .perf::after { content:''; width:2.3em; height:var(--hair); background:var(--gold6); }
.perf span { margin-right:-.3em; }
h1 { font-weight:800; letter-spacing:-.03em; line-height:1.05; white-space:nowrap; }
.sub { font-weight:700; letter-spacing:.15em; } .sub i { font-style:normal; color:var(--gold); }
.band { position:relative; border-top:var(--rule) solid var(--gold); border-bottom:var(--rule) solid var(--gold); }
.band::before, .band::after { content:''; position:absolute; left:0; right:0; height:var(--hair); background:var(--gold6); }
.band::before { top:var(--rgap); } .band::after { bottom:var(--rgap); }
.staff { position:absolute; left:50%; transform:translateX(-50%); opacity:1; pointer-events:none; }
.main { position:relative; font-weight:800; letter-spacing:-.015em; line-height:1.22; text-align:center;
        text-shadow:0 0 .12em #F5F1E8, 0 0 .25em #F5F1E8, 0 0 .4em #F5F1E8; }
.main em { font-style:normal; color:var(--gold); }
.div { display:flex; align-items:center; justify-content:center; gap:.45em; }
.div::before, .div::after { content:''; width:4.6em; height:var(--hair); background:var(--gold6); }
.div b { width:.42em; height:.42em; background:var(--gold); transform:rotate(45deg); }
.quote { color:var(--quote); font-weight:700; text-align:center; white-space:nowrap; }
.prog .hd { display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:.45em; border-bottom:var(--hair2) solid var(--gold); }
.prog .hd b { font-weight:800; } .prog .hd i { font-family:Georgia,serif; font-weight:700; font-style:italic; color:var(--gold); font-size:.76em; }
.prog .row { display:flex; align-items:center; gap:.6em; padding:.62em 0; border-bottom:var(--hair2) solid var(--gold); }
.prog .no { width:1.55em; color:var(--gold); font-weight:600; }
.prog .nm { font-weight:700; white-space:nowrap; }
.prog .ld { flex:1; height:0; border-bottom:var(--dotw) dotted var(--dot); margin:0 .3em; }
.prog .by { font-weight:500; color:var(--ink2); font-size:.9em; white-space:nowrap; }
.when { font-weight:800; letter-spacing:-.04em; white-space:nowrap; } .when span { color:var(--gold); font-size:.68em; margin-left:.35em; }
.where { font-weight:700; } .due { font-weight:600; color:var(--due); }
.fund { position:absolute; left:0; right:0; text-align:center; font-weight:500; color:var(--due); letter-spacing:.01em; }

@page { size:3000mm 500mm; margin:0; }
html, body { width:3000mm; height:500mm; }
.canvas { width:3000mm; height:500mm; display:flex; align-items:center; padding:0 120mm; gap:90mm;
          --fb:2mm; --fi:7mm; --hair:.6mm; --hair2:.8mm; --rule:1.6mm; --rgap:4.5mm; --dotw:1.2mm; }
.frame { inset:22mm; }
.left { position:relative; flex:none; width:760mm; text-align:center; }
.perf { font-size:24mm; }
h1 { margin-top:8mm; font-size:118mm; }
.sub { margin-top:12mm; font-size:44mm; }
.mid { position:relative; flex:1; }
.band { padding:34mm 0 30mm; }
.staff { top:22mm; width:1180mm; }
.main { font-size:54mm; }
.div { margin-top:14mm; font-size:20mm; }
.quote { margin-top:10mm; font-size:30mm; }
.right { position:relative; flex:none; width:560mm; border-left:1mm solid var(--gold6); padding-left:70mm; text-align:left; }
.when { font-size:92mm; line-height:1.05; } .when span { display:block; margin:6mm 0 0; font-size:.66em; }
.where { margin-top:18mm; font-size:36mm; }
.org { margin-top:16mm; font-size:24mm; }
.fund { bottom:34mm; font-size:15mm; }
</style></head><body><div class="canvas"><div class="frame"></div>
