<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성과공유회 현수막 5000x900</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  /* 실제 크기 5000 x 900 mm (재단 여백 미포함) */
  @page { size: 5000mm 900mm; margin: 0; }
  :root {
    --paper: #f5f2ec;
    --ink: #121a2f;
    --ink-2: #4a5468;
    --blue: #2b54c9;
    --blue-soft: #e1e8fa;
    --coral: #ff6b45;
    --coral-soft: #ffe4da;
    --line: #d9d2c5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 5000mm; height: 900mm; }
  body {
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--paper);
    -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden;
  }
  .canvas {
    position: relative; width: 5000mm; height: 900mm; overflow: hidden; background: var(--paper);
    display: flex; align-items: center; padding: 0 200mm; gap: 150mm;
  }
  .canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(18,26,47,.10) 1.6mm, transparent 1.8mm);
    background-size: 32mm 32mm;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 30%);
    mask-image: linear-gradient(90deg, #000 0%, transparent 30%);
  }
  .blob { position: absolute; border-radius: 50%; }
  .blob.b1 { width: 1600mm; height: 1600mm; left: -500mm; top: -500mm; background: radial-gradient(circle, var(--blue-soft) 0%, rgba(225,232,250,0) 68%); }
  .blob.b2 { width: 1400mm; height: 1400mm; right: -400mm; bottom: -800mm; background: radial-gradient(circle, var(--coral-soft) 0%, rgba(255,228,218,0) 68%); }
  .canvas > *:not(.blob) { position: relative; }

  .illust { flex: none; width: 1250mm; height: 409mm; }
  .illust svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .title { flex: none; }
  .kicker { display: inline-flex; padding: 22mm 48mm; border-radius: 999mm; background: var(--blue); color: #fff; font-size: 62mm; font-weight: 700; letter-spacing: -2mm; }
  .title h1 { margin-top: 40mm; font-size: 172mm; font-weight: 900; line-height: 1.12; letter-spacing: -8mm; }
  .title h1 .hl { color: var(--coral); }
  .title .sub { margin-top: 34mm; font-size: 56mm; font-weight: 500; letter-spacing: -2mm; color: var(--ink-2); }
  .title .sub b { color: var(--ink); font-weight: 800; }

  .divider { flex: none; width: 5mm; height: 600mm; background: var(--line); border-radius: 3mm; }

  .info { flex: none; }
  .info .row { display: flex; align-items: center; gap: 30mm; }
  .info .row + .row { margin-top: 34mm; }
  .info .row svg { width: 74mm; height: 74mm; color: var(--coral); flex: none; }
  .info .date { font-size: 104mm; font-weight: 800; letter-spacing: -4mm; line-height: 1.1; }
  .info .date span { color: var(--coral); }
  .info .place { font-size: 78mm; font-weight: 700; letter-spacing: -3mm; }
  .info .org { margin-top: 56mm; padding-top: 34mm; border-top: 4mm solid var(--line); display: flex; align-items: center; gap: 20mm; font-size: 50mm; font-weight: 700; letter-spacing: -1.5mm; color: var(--ink-2); }
  .info .org .mark { width: 70mm; height: 70mm; border-radius: 18mm; background: var(--ink); display: grid; place-items: center; }
  .info .org .mark svg { width: 40mm; height: 40mm; }
</style>
</head>
<body>
<div class="canvas">
  <div class="blob b1"></div><div class="blob b2"></div>

  <!-- 일러스트: 말로 요청 → 에이전트 완성 -->
  <div class="illust">
    <svg viewBox="0 0 1008 330" aria-hidden="true">
      <defs>
        <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#121a2f" flood-opacity=".10"/></filter>
        <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ff6b45"/></marker>
      </defs>
      <g filter="url(#sh)"><rect x="0" y="12" width="580" height="306" rx="24" fill="#fff"/></g>
      <circle cx="30" cy="42" r="7" fill="#ff8a6b"/><circle cx="52" cy="42" r="7" fill="#f6c34a"/><circle cx="74" cy="42" r="7" fill="#5cc28a"/>
      <text x="100" y="49" font-size="19" font-weight="700" fill="#8a91a2">바이브코딩 · 말로 만드는 코드</text>
      <line x1="0" y1="70" x2="580" y2="70" stroke="#efeae1" stroke-width="2"/>
      <rect x="168" y="88" width="388" height="92" rx="22" fill="#2b54c9"/>
      <text x="192" y="126" font-size="23" font-weight="700" fill="#fff">우리 부서 엑셀 데이터로</text>
      <text x="192" y="160" font-size="23" font-weight="700" fill="#fff">현황 대시보드 만들어 줘</text>
      <circle cx="44" cy="222" r="20" fill="#ff6b45"/>
      <path d="M44 208l3.2 8.8 8.8 3.2-8.8 3.2L44 232l-3.2-8.8-8.8-3.2 8.8-3.2z" fill="#fff"/>
      <rect x="76" y="198" width="400" height="104" rx="22" fill="#f1efe9"/>
      <text x="98" y="234" font-size="21" font-weight="700" fill="#121a2f">좋아요! 데이터를 읽고 만들어 볼게요</text>
      <rect x="98" y="254" width="70" height="12" rx="6" fill="#2b54c9" opacity=".55"/>
      <rect x="176" y="254" width="140" height="12" rx="6" fill="#ff6b45" opacity=".45"/>
      <rect x="324" y="254" width="90" height="12" rx="6" fill="#121a2f" opacity=".15"/>
      <rect x="118" y="276" width="110" height="12" rx="6" fill="#121a2f" opacity=".15"/>
      <rect x="236" y="276" width="80" height="12" rx="6" fill="#2b54c9" opacity=".55"/>
      <path d="M600 166 C 630 120, 650 120, 676 150" fill="none" stroke="#ff6b45" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/>
      <path d="M636 92l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#2b54c9"/>
      <g filter="url(#sh)"><rect x="690" y="40" width="318" height="278" rx="24" fill="#fff"/></g>
      <text x="716" y="88" font-size="21" font-weight="800" fill="#121a2f">부서 현황 대시보드</text>
      <text x="716" y="114" font-size="16" font-weight="600" fill="#8a91a2">업무 데이터 자동 연동</text>
      <line x1="716" y1="282" x2="982" y2="282" stroke="#e3ddd2" stroke-width="2"/>
      <rect x="730" y="206" width="30" height="76" rx="7" fill="#e1e8fa"/>
      <rect x="776" y="172" width="30" height="110" rx="7" fill="#9fb3ea"/>
      <rect x="822" y="190" width="30" height="92" rx="7" fill="#e1e8fa"/>
      <rect x="868" y="148" width="30" height="134" rx="7" fill="#2b54c9"/>
      <rect x="914" y="130" width="30" height="152" rx="7" fill="#ff6b45"/>
      <rect x="826" y="10" width="198" height="50" rx="25" fill="#ff6b45"/>
      <circle cx="853" cy="35" r="13" fill="#fff"/>
      <path d="M846 35l5 5 9-10" fill="none" stroke="#ff6b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="876" y="43" font-size="21" font-weight="800" fill="#fff">에이전트 완성</text>
    </svg>
  </div>

  <div class="title">
    <span class="kicker">AI 마에스트로 성과공유회</span>
    <h1>코딩을 몰라도,<br><span class="hl">AI 에이전트</span>를 만들었습니다</h1>
    <p class="sub"><b>AI 교육</b>과 <b>자율 스터디</b>에서 경험하고 느낀 <b>바이브코딩</b> 이야기</p>
  </div>

  <div class="divider"></div>

  <div class="info">
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div class="date">10. 30.(금) <span>오후 2시</span></div></div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="place">대학본부 본관 3층 대강당</div></div>
    <div class="org"><span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="#ff6b45"/><circle cx="19" cy="19" r="2.2" fill="#fff"/></svg></span>부산대학교 AX·정보화혁신본부</div>
  </div>
</div>
</body>
</html>
